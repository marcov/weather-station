<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

       content="Dati in tempo reale delle stazioni meteo di Fiobbio di Albino e
                del Monte Misma.
                Immagini in diretta webcam Fiobbio di Albino.
                Immagini in diretta webcam Monte Misma.

    <!-- React and Babel from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <!-- Other dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Padding for PWA */
        html {
            min-height: calc(100% + env(safe-area-inset-top));
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        body {
           touch-action: manipulation;
        }

        .swipe-container {
            overflow-x: scroll;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .swipe-container::-webkit-scrollbar {
            display: none;
        }
        .swipe-item {
            scroll-snap-align: start;
            flex: 0 0 100%;
            width: 100%;
        }
        .swipe-container {
            visibility: hidden;
        }
        .swipe-container.loaded {
            visibility: visible;
        }

        .station-arrow {
            display: none;
        }

        @media (min-width: 640px) and (pointer: fine) {
            .station-arrow {
                display: flex;
            }
            .swipe-container {
                cursor: grab;
            }
            .swipe-container.dragging {
                cursor: grabbing;
                scroll-snap-type: none;
                user-select: none;
            }
        }

        .chart-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            padding: 1rem;
            animation: fadeIn 0.2s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .chart-container {
            max-width: 100%;
            max-height: 90vh;
            position: relative;
        }

        .chart-container img {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
        }

        .meteoblue-widget {
            display: block;
            width: 100%;
            height: clamp(350px, 72vw, 420px);
            border: 0;
            overflow: hidden;
        }

        .map-view {
            width: 100%;
        }

        .map-frame {
            display: block;
            width: 100%;
            height: calc(100dvh - 11rem);
            min-height: 32rem;
            border: 0;
        }

        @media (min-width: 640px) {
            .map-view {
                width: min(calc(100vw - 2rem), 90rem);
                margin-left: 50%;
                transform: translateX(-50%);
            }
        }

        @media (max-width: 639px) {
            html.map-view-active {
                box-sizing: border-box;
                width: 100%;
                height: 100dvh;
                min-height: 100dvh;
                overflow: hidden;
            }

            html.map-view-active body,
            body.map-view-active #root {
                height: 100%;
                min-height: 0;
                overflow: hidden;
            }

            .map-active-layout.map-active-layout {
                display: flex;
                flex-direction: column;
                height: 100%;
                min-height: 0;
                padding-bottom: 0;
                overflow: hidden;
            }

            .map-active-layout header {
                margin-bottom: 0.5rem;
            }

            .map-active-layout .station-subtext {
                display: none;
            }

            .map-active-layout > nav {
                margin-bottom: 0;
            }

            .map-view {
                display: flex;
                flex-direction: column;
                flex: 1;
                min-height: 0;
                width: 100vw;
                margin-left: 50%;
                transform: translateX(-50%);
            }

            .map-frame-shell {
                display: flex;
                flex: 1;
                min-height: 0;
                border: 4px solid rgba(100, 116, 139, 0.8);
            }

            .map-frame {
                flex: 1;
                height: auto;
                min-height: 0;
            }
        }

    </style>
</head>
<body class="bg-gradient-to-br from-slate-800 to-slate-900 text-gray-100 min-h-screen">
    <div id="root"></div>

    <script type="text/jsx">
        function WeatherStation({ data, name, webcamSrc, onLoad }) {
            const [activeChart, setActiveChart] = React.useState(null); // null, 'temp', 'wind', 'humidity', or 'rain'
            const [isWebcamZoomed, setIsWebcamZoomed] = React.useState(false);

            React.useEffect(() => {
                if (data) {
                    lucide.createIcons();
                    onLoad && onLoad(name);
                }
            }, [data, name, onLoad]);

            const getChartUrl = (type) => {
                const stationId = name.toLowerCase().replace(' ', '');
                const chartTypes = {
                    temp: 'daytempdew.png',
                    humidity: 'dayhum.png',
                    wind: 'daywind.png',
                    rain: 'dayrain.png'
                };
                return `/${stationId}/${chartTypes[type]}`;
            };

            const toggleChart = (type) => (e) => {
                e.preventDefault();
                setActiveChart(activeChart === type ? null : type);
            };

            const toggleWebcamZoom = (e) => {
                e.preventDefault();
                setIsWebcamZoomed(!isWebcamZoomed);
            };

            if (!data) {
                return (
                    <div className="swipe-item px-2">
                        <div className="bg-slate-800/50 rounded-lg backdrop-blur-sm mb-4 h-64 flex items-center justify-center animate-pulse">
                            <span className="text-gray-400">Loading {name}...</span>
                        </div>
                    </div>
                );
            }

            return (
                <div className="swipe-item px-2">
                    {activeChart && (
                        <div className="chart-overlay" onClick={() => setActiveChart(null)}>
                            <div className="chart-container">
                                <img
                                    src={getChartUrl(activeChart)}
                                    alt={`${activeChart.charAt(0).toUpperCase() + activeChart.slice(1)} Chart for ${name}`}
                                    className="rounded-lg shadow-lg"
                                />
                            </div>
                        </div>
                    )}

                    {isWebcamZoomed && webcamSrc && (
                        <div className="chart-overlay" onClick={toggleWebcamZoom}>
                            <div className="chart-container">
                                <img
                                    src={webcamSrc}
                                    alt={`Webcam ${name}`}
                                    className="rounded-lg shadow-lg"
                                />
                            </div>
                        </div>
                    )}

                    <div className="bg-slate-800/50 rounded-lg backdrop-blur-sm mb-4">
                        <div className="flex justify-between items-center mb-2">
                            <h2 className="text-lg font-semibold">{name}</h2>
                            <span className="text-gray-400 text-sm">
                                {data.stationTime.split(':').slice(0,2).join(':')}
                            </span>
                        </div>

                        <div className="grid grid-cols-2 gap-2">
                            {/* Temperature Box */}
                            <div
                                className={`bg-slate-700/50
                                            rounded-lg
                                            p-4
                                            cursor-pointer
                                            hover:bg-slate-600/50
                                            transition-colors
                                            duration-200
                                `}
                                onClick={toggleChart('temp')}
                            >
                                <div className="flex items-center gap-2 text-yellow-400">
                                    <i data-lucide="thermometer" className="w-4 h-4"></i>
                                    <span className="text-sm">Temperatura</span>
                                </div>
                                <div className="text-2xl font-bold mt-2">
                                    {data.outsideTemp}°C
                                </div>
                                <div className="flex justify-between mt-2 text-sm">
                                    <div className="text-blue-400">
                                        <div className="flex items-center gap-1">
                                            <i data-lucide="arrow-down" className="w-3 h-3"></i>
                                            {data.lowOutsideTemp}°C
                                        </div>
                                        <div className="text-xs opacity-75 mt-0.5 text-left">
                                            {data.lowOutsideTempTime.split(':').slice(0,2).join(':')}
                                        </div>
                                    </div>
                                    <div className="text-red-400">
                                        <div className="flex items-center gap-1">
                                            <i data-lucide="arrow-up" className="w-3 h-3"></i>
                                            {data.hiOutsideTemp}°C
                                        </div>
                                        <div className="text-xs opacity-75 mt-0.5 text-right">
                                            {data.hiOutsideTempTime.split(':').slice(0,2).join(':')}
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Wind Box */}
                            <div
                                className="bg-slate-700/50 rounded-lg p-4 cursor-pointer hover:bg-slate-600/50 transition-colors duration-200"
                                onClick={toggleChart('wind')}
                            >
                                <div className="flex items-center gap-2 text-blue-400">
                                    <i data-lucide="wind" className="w-4 h-4"></i>
                                    <span className="text-sm">Vento</span>
                                </div>
                                <span className="text-2xl font-bold mt-2"> {data.windSpeed} km/h </span>
                                <span className="text-md font-bold mt-2">
                                    {data.windDirection}
                                </span>
                                <div className="text-sm text-gray-400 mt-2">
                                    <div className="flex justify-between mt-2">
                                        <span className="text-left">Raffica: {data.windGustSpeed}km/h</span>
                                        <span className="text-right">Max: {data.hiWindSpeed}km/h</span>
                                    </div>
                                </div>
                            </div>

                            {/* Humidity Box */}
                            <div
                                className="bg-slate-700/50 rounded-lg p-4 cursor-pointer hover:bg-slate-600/50 transition-colors duration-200"
                                onClick={toggleChart('humidity')}
                            >
                                <div className="flex items-center gap-2 text-cyan-400">
                                    <i data-lucide="droplets" className="w-4 h-4"></i>
                                    <span className="text-sm">Umidità</span>
                                </div>
                                <div className="text-2xl font-bold mt-2">
                                    {data.outsideHumidity}%
                                </div>
                                <div className="text-sm text-gray-400 mt-2">
                                    <div className="flex justify-between mt-2">
                                        <span>Min: {data.lowHumidity}%</span>
                                        <span>Max: {data.hiHumidity}%</span>
                                    </div>
                                </div>
                            </div>

                            {/* Rain Box */}
                            <div
                                className="bg-slate-700/50 rounded-lg p-4 cursor-pointer hover:bg-slate-600/50 transition-colors duration-200"
                                onClick={toggleChart('rain')}
                            >
                                <div className="flex items-center gap-2 text-indigo-400">
                                    <i data-lucide="cloud" className="w-4 h-4"></i>
                                    <span className="text-sm">Pioggia</span>
                                </div>
                                <div className="text-2xl font-bold mt-2">
                                    {data.rainRate} mm/h
                                </div>
                                <div className="text-sm text-gray-400 mt-2">
                                    <div className="flex justify-between mt-2">
                                        <span className="text-left">Giorno: {data.dailyRain}mm</span>
                                        <span className="text-right">Storm: {data.stormRain}mm</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    {webcamSrc && (
                        <div className="bg-slate-800/50 rounded-lg overflow-hidden cursor-pointer" onClick={toggleWebcamZoom}>
                            <img src={webcamSrc}
                                 alt={`Webcam ${name}`}
                                 className="w-full h-auto object-contain" />
                        </div>
                    )}
                </div>
            );
        }

            return (
                <section aria-labelledby="forecast-title">
                    <div className="flex items-end justify-between gap-3 mb-2 px-1">
                        <div>
                            <p className="text-xs font-semibold uppercase tracking-widest text-blue-300">
                                Albino
                            </p>
                            <h2 id="forecast-title" className="text-lg font-semibold">
                                Previsioni meteo
                            </h2>
                        </div>
                        <a
                            href="https://www.meteoblue.com/en/weather/week/albino_italy_3183316/"
                            target="_blank"
                            rel="noopener noreferrer"
                            className="text-xs font-semibold text-gray-400 hover:text-gray-200 transition-colors"
                        >
                            7 giorni ↗
                        </a>
                    </div>

                    <div className="bg-slate-800/50 rounded-lg overflow-hidden shadow-lg">
                        <iframe
                            className="meteoblue-widget"
                            src={widgetUrl}
                            title="Previsioni Meteoblue per Albino"
                            scrolling="no"
                            allowTransparency="true"

        function ZoomableForecastImage({ src, alt, title }) {
            const [isZoomed, setIsZoomed] = React.useState(false);

            return (
                <React.Fragment>
                    {isZoomed && (
                        <div className="chart-overlay" onClick={() => setIsZoomed(false)}>
                            <div className="chart-container w-full">
                                <img src={src} alt={alt} className="w-full h-auto rounded-lg shadow-lg" />
                            </div>
                        </div>
                    )}

                    <button
                        type="button"
                        onClick={() => setIsZoomed(true)}
                        className="block w-full bg-white rounded-lg overflow-hidden shadow-lg cursor-zoom-in"
                        title={title}
                    >
                        <img
                            src={src}
                            alt={alt}
                            className="block w-full h-auto"
                            loading="lazy"
                        />
                    </button>
                </React.Fragment>

        function App() {
            const [activeView, setActiveView] = React.useState('stations');
            const [mapLoaded, setMapLoaded] = React.useState(false);
            const [menuOpen, setMenuOpen] = React.useState(false);
            const [stationInfo, setStationInfo] = React.useState(null);
            const [weatherData, setWeatherData] = React.useState({
                fiobbio1: null,
                misma: null
            });
            const [loadedStations, setLoadedStations] = React.useState(new Set());
            const [stationIndex, setStationIndex] = React.useState(0);
            const [isDraggingStations, setIsDraggingStations] = React.useState(false);
            const [stationCarouselReady, setStationCarouselReady] = React.useState(false);
            const containerRef = React.useRef(null);
            const stationDragRef = React.useRef({
                active: false,
                startX: 0,
                scrollLeft: 0,
                moved: false,
                captured: false
            });
            const stationWheelRef = React.useRef({ locked: false, timeout: null });

            const handleStationLoad = React.useCallback((stationName) => {
                setLoadedStations(prev => {
                    const newSet = new Set(prev);
                    newSet.add(stationName);
                    return newSet;
                });
            }, []);

            // Initialize the view on Fiobbio 1.
            React.useEffect(() => {
                if (containerRef.current) {
                    containerRef.current.scrollLeft = 0;
                    setStationCarouselReady(true);
                }
            }, []);

            const fetchWeatherData = () => {
                const loadStation = (key, url) => {
                    fetch(url)
                        .then(res => res.json())
                        .then(data => {
                            setWeatherData(prev => ({ ...prev, [key]: data }));
                        })
                        .catch(err => console.error(`Failed to load ${key}:`, err));
                };

                loadStation('fiobbio1', '/fiobbio1/realtime.json');
                loadStation('misma', '/misma/realtime.json');

                fetch('/fiobbio1/stationinfo.json')
                    .then(res => res.json())
                    .then(setStationInfo)
                    .catch(err => console.error('Failed to load station info:', err));
            };

            React.useEffect(() => {
                fetchWeatherData();

                const interval = setInterval(fetchWeatherData, 5 * 60 * 1000);
                return () => clearInterval(interval);
            }, []);

            const handleScroll = React.useCallback((e) => {
                const container = e.target;
                const scrollPosition = container.scrollLeft;
                const containerWidth = container.clientWidth;
                const nextStationIndex = Math.round(scrollPosition / containerWidth);
                setStationIndex(nextStationIndex);

                const dots = document.querySelectorAll('#dots div');
                dots.forEach((dot, index) => {
                    if (index === nextStationIndex) {
                        dot.classList.remove('bg-gray-600');
                        dot.classList.add('bg-white');
                    } else {
                        dot.classList.remove('bg-white');
                        dot.classList.add('bg-gray-600');
                    }
                });
            }, []);

            const scrollToStation = React.useCallback((index) => {
                const container = containerRef.current;
                if (!container) return;

                container.scrollTo({
                    left: Math.max(0, Math.min(1, index)) * container.clientWidth,
                    behavior: 'smooth'
                });
            }, []);

            const handleStationWheel = React.useCallback((event) => {
                if (!window.matchMedia('(min-width: 640px) and (pointer: fine)').matches) return;
                if (Math.abs(event.deltaY) <= Math.abs(event.deltaX)) return;

                const container = event.currentTarget;
                const maxScrollLeft = container.scrollWidth - container.clientWidth;
                const movingRight = event.deltaY > 0;
                const canMove = movingRight
                    ? container.scrollLeft < maxScrollLeft - 1
                    : container.scrollLeft > 1;

                if (canMove) {
                    event.preventDefault();
                    if (stationWheelRef.current.locked) return;

                    stationWheelRef.current.locked = true;
                    container.scrollTo({
                        left: movingRight ? maxScrollLeft : 0,
                        behavior: 'smooth'
                    });
                    stationWheelRef.current.timeout = window.setTimeout(() => {
                        stationWheelRef.current.locked = false;
                    }, 500);
                }
            }, []);

            React.useEffect(() => {
                const container = containerRef.current;
                if (!container) return;

                container.addEventListener('wheel', handleStationWheel, { passive: false });
                return () => {
                    container.removeEventListener('wheel', handleStationWheel);
                    window.clearTimeout(stationWheelRef.current.timeout);
                };
            }, [handleStationWheel]);

            const handleStationPointerDown = React.useCallback((event) => {
                if (event.pointerType !== 'mouse' || event.button !== 0) return;

                const container = event.currentTarget;
                stationDragRef.current = {
                    active: true,
                    startX: event.clientX,
                    scrollLeft: container.scrollLeft,
                    moved: false,
                    captured: false
                };
            }, []);

            const handleStationPointerMove = React.useCallback((event) => {
                const drag = stationDragRef.current;
                if (!drag.active) return;

                const distance = event.clientX - drag.startX;
                if (!drag.moved && Math.abs(distance) > 4) {
                    drag.moved = true;
                    drag.captured = true;
                    event.currentTarget.setPointerCapture(event.pointerId);
                    setIsDraggingStations(true);
                }
                if (!drag.moved) return;
                event.currentTarget.scrollLeft = drag.scrollLeft - distance;
            }, []);

            const finishStationDrag = React.useCallback((event) => {
                const drag = stationDragRef.current;
                if (!drag.active) return;

                drag.active = false;
                setIsDraggingStations(false);
                if (drag.captured && event.currentTarget.hasPointerCapture(event.pointerId)) {
                    event.currentTarget.releasePointerCapture(event.pointerId);
                }
                scrollToStation(Math.round(event.currentTarget.scrollLeft / event.currentTarget.clientWidth));
            }, [scrollToStation]);

            const preventClickAfterDrag = React.useCallback((event) => {
                if (stationDragRef.current.moved) {
                    event.preventDefault();
                    event.stopPropagation();
                    stationDragRef.current.moved = false;
                }
            }, []);

            const showMap = React.useCallback(() => {
                setMapLoaded(true);
                setActiveView('map');
            }, []);

            React.useEffect(() => {
                const mapActive = activeView === 'map';
                document.documentElement.classList.toggle('map-view-active', mapActive);
                document.body.classList.toggle('map-view-active', mapActive);

                return () => {
                    document.documentElement.classList.remove('map-view-active');
                    document.body.classList.remove('map-view-active');
                };
            }, [activeView]);

            return (
                <div className={`max-w-full mx-2 p-2 sm:max-w-xl sm:mx-auto sm:px-4 ${activeView === 'map' ? 'map-active-layout' : ''}`}>
                    <header className="mb-4">
                        <div className="relative flex items-start justify-between gap-2">
                            <div>
                                <h1 className="text-2xl font-bold tracking-wider">Meteo Fiobbio</h1>
                                {stationInfo && (
                                    <p
                                        className="station-subtext mt-0 flex flex-wrap items-center gap-x-2 gap-y-1 text-xs leading-tight text-gray-400"
                                        aria-label="Informazioni sulla stazione"
                                    >
                                        <span title="Alba">↗ {stationInfo.sunriseTime}</span>
                                        <span title="Tramonto">↘ {stationInfo.sunsetTime}</span>
                                        <span aria-hidden="true">·</span>
                                        <span title="Fase lunare">☽ {stationInfo.moonPhase}</span>
                                    </p>
                                )}
                            </div>
                            <div className="relative">
                                <button
                                    type="button"
                                    onClick={() => setMenuOpen(open => !open)}
                                    aria-label="Apri menu"
                                    aria-expanded={menuOpen}
                                    aria-controls="main-menu"
                                    className="rounded-md p-2 text-gray-400 hover:bg-slate-700/60 hover:text-gray-200 transition-colors"
                                >
                                    <svg
                                        aria-hidden="true"
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        stroke="currentColor"
                                        strokeWidth="2"
                                        strokeLinecap="round"
                                        className="h-5 w-5"
                                    >
                                        <path d="M4 6h16M4 12h16M4 18h16"></path>
                                    </svg>
                                </button>

                                {menuOpen && (
                                    <nav
                                        id="main-menu"
                                        aria-label="Menu principale"
                                        className="absolute right-0 z-40 mt-1 w-48 overflow-hidden rounded-lg border border-slate-700 bg-slate-800 shadow-xl"
                                    >
                                        <a
                                            href="/grafana/d/Ewu-ii3Mk/wview-all-stations?orgId=1&kiosk=tv"
                                            onClick={() => setMenuOpen(false)}
                                            className="block px-4 py-3 text-sm font-semibold text-gray-200 hover:bg-slate-700"
                                        >
                                            Dettagli
                                        </a>
                                        <a
                                            href="/grafana/d/-qh9KGzRk/wview-past-years-comparison--and-misma?orgId=1&kiosk=tv"
                                            onClick={() => setMenuOpen(false)}
                                            className="block border-t border-slate-700 px-4 py-3 text-sm font-semibold text-gray-200 hover:bg-slate-700"
                                        >
                                            Serie Storiche
                                        </a>
                                        <a
                                            href="/archive.html"
                                            onClick={() => setMenuOpen(false)}
                                            className="block border-t border-slate-700 px-4 py-3 text-sm font-semibold text-gray-200 hover:bg-slate-700"
                                        >
                                            Archivio
                                        </a>
                                        <a
                                            href="/legacy.html"
                                            onClick={() => setMenuOpen(false)}
                                            className="block border-t border-slate-700 px-4 py-3 text-sm font-semibold text-gray-200 hover:bg-slate-700"
                                        >
                                            Vista classica
                                        </a>
                                        <a
                                            href="mailto:marcelloalborghetti@gmail.com,marco.vedovati@gmail.com"
                                            onClick={() => setMenuOpen(false)}
                                            className="block border-t border-slate-700 px-4 py-3 text-sm font-semibold text-gray-200 hover:bg-slate-700"
                                        >
                                            Contatti
                                        </a>
                                    </nav>
                                )}
                            </div>
                        </div>
                    </header>

                    <nav
                        className="grid grid-cols-3 gap-1 rounded-lg bg-slate-800/70 p-1 mb-4"
                        aria-label="Contenuto meteo"
                    >
                        <button
                            type="button"
                            onClick={() => setActiveView('stations')}
                            aria-pressed={activeView === 'stations'}
                            className={`rounded-md px-3 py-2 text-sm font-semibold transition-colors ${
                                activeView === 'stations'
                                    ? 'bg-slate-600 text-white shadow-sm'
                                    : 'text-gray-400 hover:text-gray-200'
                            }`}
                        >
                            Stazioni
                        </button>
                        <button
                            type="button"
                            onClick={() => setActiveView('forecasts')}
                            aria-pressed={activeView === 'forecasts'}
                            className={`rounded-md px-3 py-2 text-sm font-semibold transition-colors ${
                                activeView === 'forecasts'
                                    ? 'bg-slate-600 text-white shadow-sm'
                                    : 'text-gray-400 hover:text-gray-200'
                            }`}
                        >
                            Previsioni
                        </button>
                        <button
                            type="button"
                            onClick={showMap}
                            aria-pressed={activeView === 'map'}
                            className={`rounded-md px-3 py-2 text-sm font-semibold transition-colors ${
                                activeView === 'map'
                                    ? 'bg-slate-600 text-white shadow-sm'
                                    : 'text-gray-400 hover:text-gray-200'
                            }`}
                        >
                            Mappa
                        </button>
                    </nav>

                    <section
                        className={activeView === 'stations' ? '' : 'hidden'}
                        aria-label="Stazioni meteo"
                        aria-hidden={activeView !== 'stations'}
                    >
                        <div className="flex justify-center gap-2 mb-4" id="dots">
                            <div className="w-2 h-2 rounded-full transition-colors duration-300 bg-white" data-station="fiobbio1"></div>
                            <div className="w-2 h-2 rounded-full transition-colors duration-300 bg-gray-600" data-station="misma"></div>
                        </div>

                        <div className="relative">
                            <button
                                type="button"
                                onClick={() => scrollToStation(stationIndex - 1)}
                                disabled={stationIndex === 0}
                                aria-label="Stazione precedente"
                                className="station-arrow absolute left-2 top-1/2 -translate-y-1/2 z-20 h-10 w-10 items-center justify-center rounded-full bg-slate-900/75 text-white shadow-lg backdrop-blur-sm transition-opacity disabled:opacity-0"
                            >
                                <span aria-hidden="true" className="text-2xl leading-none">‹</span>
                            </button>
                            <button
                                type="button"
                                onClick={() => scrollToStation(stationIndex + 1)}
                                disabled={stationIndex === 1}
                                aria-label="Stazione successiva"
                                className="station-arrow absolute right-2 top-1/2 -translate-y-1/2 z-20 h-10 w-10 items-center justify-center rounded-full bg-slate-900/75 text-white shadow-lg backdrop-blur-sm transition-opacity disabled:opacity-0"
                            >
                                <span aria-hidden="true" className="text-2xl leading-none">›</span>
                            </button>

                            <div
                                className={`swipe-container ${stationCarouselReady ? 'loaded' : ''} ${isDraggingStations ? 'dragging' : ''}`}
                                ref={containerRef}
                                onScroll={handleScroll}
                                onPointerDown={handleStationPointerDown}
                                onPointerMove={handleStationPointerMove}
                                onPointerUp={finishStationDrag}
                                onPointerCancel={finishStationDrag}
                                onClickCapture={preventClickAfterDrag}
                            >
                                <div className="flex">
                                    <WeatherStation
                                        data={weatherData.fiobbio1}
                                        name="Fiobbio 1"
                                        webcamSrc="/webcam/webcam_fiobbio.jpg"
                                        onLoad={handleStationLoad}
                                    />
                                    <WeatherStation
                                        data={weatherData.misma}
                                        name="Misma"
                                        webcamSrc="/webcam/webcam_misma.jpg"
                                        onLoad={handleStationLoad}
                                    />
                                </div>
                            </div>
                        </div>
                    </section>

                    <div
                        className={activeView === 'forecasts' ? '' : 'hidden'}
                        aria-hidden={activeView !== 'forecasts'}
                    >
                        <MeteoblueForecast />
                        <WetterzentraleForecast />
                        <WetterzentraleEnsembleForecast />
                    </div>

                    {mapLoaded && (
                        <section
                            className={`map-view ${activeView === 'map' ? '' : 'hidden'}`}
                            aria-label="Mappa meteo CML"
                            aria-hidden={activeView !== 'map'}
                        >
                            <div className="mb-2 flex justify-end pl-1 pr-3">
                                <a
                                    href="https://cml-map.pages.dev/"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="text-xs font-semibold text-gray-400 hover:text-gray-200 transition-colors"
                                >
                                    Visita Mappa ↗
                                </a>
                            </div>
                            <div className="map-frame-shell overflow-hidden rounded-none bg-slate-800/50 shadow-lg sm:rounded-lg">
                                <iframe
                                    className="map-frame"
                                    src="https://cml-map.pages.dev/?simplified=1"
                                    title="Mappa meteo in tempo reale CML"
                                    loading="lazy"
                                ></iframe>
                            </div>
                        </section>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
